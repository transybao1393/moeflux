[package]
name          = "moeflux-net"
description   = "Pipeline-parallel moeflux over TCP: frames, a stage node, a coordinator and a layer-range planner."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
authors       = { workspace = true }
publish       = false

[features]
default = []

# Model variant, forwarded to `moeflux`. Select exactly one (the node
# runs a moeflux context; frames and the planner are variant-free).
model-qwen3-5-a17b      = ["moeflux/model-qwen3-5-a17b"]
model-qwen3-6-35b-a3b   = ["moeflux/model-qwen3-6-35b-a3b"]
model-cogito-v2-671b    = ["moeflux/model-cogito-v2-671b"]
model-olmoe-1b-7b       = ["moeflux/model-olmoe-1b-7b"]

[dependencies]
moeflux     = { path = "../moeflux" }
thiserror   = { workspace = true }
bytemuck    = { workspace = true }
serde_json  = { workspace = true }

[[bin]]
name = "moeflux-node"
path = "src/bin/moeflux-node.rs"

[[bin]]
name = "moeflux-coord"
path = "src/bin/moeflux-coord.rs"
